[project]
name = "traffic-incident-prediction"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32.3",
    "matplotlib==3.9.1",
    "seaborn>=0.13.2",
    "pandas>=2.2.3",
    "numpy==1.26.4",
    "pykrige>=1.7.2",
    "tqdm>=4.67.1",
    "bs4>=0.0.2",
    "arviz>=0.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_incident_prediction"]


[tool.uv]
dev-dependencies = [
    "jupyter",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
]
